services:
  - type: web
    name: n8n-automation-service
    runtime: docker
    plan: free
    startCommand: n8n
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-database-hub
          property: host
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-database-hub
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-database-hub
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-database-hub
          property: password

databases:
  - name: n8n-database-hub
    plan: free
    databaseName: n8ndb
    user: n8nuser
