services:
  # This installs your n8n automation engine
  - type: web
    name: n8n-service
    env: docker
    plan: free
    startCommand: n8n
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromService:
          type: database
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_DATABASE
        fromService:
          type: database
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromService:
          type: database
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromService:
          type: database
          name: n8n-db
          property: password

  # This sets up the database so your workflows never get deleted
  - type: database
    name: n8n-db
    plan: free
    databaseName: n8ndb
    user: n8nuser
